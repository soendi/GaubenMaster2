name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Tag und Version prüfen
        run: python scripts/check_version.py "${{ github.ref_name }}"
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: WiX installieren
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          & $wix extension add -g WixToolset.Util.wixext/6.0.2
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".dotnet\tools")
      - name: Bauen und Artefakt testen
        shell: pwsh
        env:
          GM_PYTHON: python
        run: ./scripts/build.ps1 -SkipTests
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/GaubenMaster2-Setup-*.msi
            dist/SHA256SUMS.txt
            dist/build-metrics.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag und Version prüfen
        run: |
          version=$(python scripts/check_version.py "${{ github.ref_name }}")
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/GaubenMaster2-Setup-${VERSION}.msi" \
            dist/SHA256SUMS.txt \
            dist/build-metrics.json \
            --verify-tag \
            --title "GaubenMaster2 ${VERSION}" \
            --generate-notes
