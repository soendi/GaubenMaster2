name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Version prüfen
        run: python scripts/check_version.py
      - name: Unit-Tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Abhängigkeiten
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: WiX installieren
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          & $wix extension add -g WixToolset.Util.wixext/6.0.2
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".dotnet\tools")
      - name: Bauen und Artefakt testen
        shell: pwsh
        env:
          GM_PYTHON: python
        run: ./scripts/build.ps1 -SkipTests
      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: gaubenmaster2-build
          path: |
            dist/GaubenMaster2-Setup-*.msi
            dist/SHA256SUMS.txt
            dist/build-metrics.json
          if-no-files-found: error
          retention-days: 7
